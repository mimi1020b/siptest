<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>職安衛乙級｜100 題離線模擬測驗</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#151e30;--panel2:#202d44;--border:#33415a;--text:#eff5ff;--muted:#9fb0c9;--accent:#6db4fb;--green:#49d19b;--red:#ff808d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1d2e48,#0b1120 63%);color:var(--text);font:16px/1.6 system-ui,'Microsoft JhengHei',sans-serif}main{max-width:900px;margin:auto;padding:28px 18px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,34px);margin:0}h2{font-size:23px;margin:0 0 12px}.sub,small,.muted{color:var(--muted)}.pill{border:1px solid #4772a1;padding:5px 12px;border-radius:30px;color:#d2eaff;font-size:13px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:clamp(18px,4vw,30px);margin:16px 0;box-shadow:0 12px 28px #0002}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:var(--panel2);border-radius:12px;padding:14px;text-align:center}.metric strong{font-size:28px;display:block}.metric small{font-size:13px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:1px solid #49617c;border-radius:10px;background:#233550;color:var(--text);padding:11px 17px;font:inherit;cursor:pointer;font-weight:650}.btn.primary{background:#397ed0;border-color:#397ed0;color:white}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.danger{border-color:#b85e64;color:#ffb8c0}.btn:hover:not(:disabled){filter:brightness(1.15)}.radio-row{display:flex;gap:10px;align-items:center;padding:9px 0}.radio-row input{accent-color:var(--accent)}.choices{display:grid;gap:12px;margin-top:22px}.choice{width:100%;text-align:left;border:1px solid #4a607e;background:#1b2940;border-radius:13px;color:var(--text);padding:15px 18px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;font:inherit}.letter{background:#334869;border-radius:8px;padding:3px 11px;font-weight:750}.choice.selected{border-color:var(--accent);background:#223c59}.choice.correct{border-color:var(--green);background:#163e38}.choice.wrong{border-color:var(--red);background:#472832}.choice:disabled{cursor:default;opacity:1}.bar{height:10px;background:#334058;border-radius:20px;overflow:hidden;margin:14px 0 5px}.bar>div{background:var(--green);height:100%;transition:width .25s}.feedback{border-left:4px solid var(--green);background:#14372f;padding:14px 16px;margin-top:20px;border-radius:0 10px 10px 0}.feedback.bad{border-color:var(--red);background:#3a242f}.answer-item{padding:15px 0;border-top:1px solid var(--border)}.tag{font-size:12px;border-radius:6px;background:#284159;padding:3px 7px}.red{color:var(--red)}.green{color:var(--green)}.hidden{display:none!important}.note{border:1px solid var(--border);padding:12px 15px;border-radius:10px;background:#1d2b40;color:var(--muted)}.history{width:100%;border-collapse:collapse;margin-top:14px}.history td,.history th{padding:10px 7px;text-align:left;border-bottom:1px solid var(--border);font-size:14px}.history th{color:var(--muted)}.history button{padding:4px 9px;font-size:13px}#questionText{white-space:pre-wrap;font-weight:670;font-size:21px;line-height:1.7;margin:20px 0}#wrongList{max-height:450px;overflow:auto}input[type=file]{display:none}@media(max-width:550px){.grid{gap:6px}.metric{padding:8px}.metric strong{font-size:23px}.panel{border-radius:15px}.controls .btn{flex:1}.history td,.history th{font-size:12px;padding:8px 4px}}
</style></head><body><main><header><div><h1>職安衛乙級 · 模擬測驗</h1><div class="sub">支援匯入 CSV｜題目與選項洗牌｜錯題重測</div></div><span class="pill">完全離線 · 無須安裝</span></header>
<section id="home"><div class="panel"><h2>開始測驗</h2><div class="note"><strong>目前題庫：</strong><span id="bankStatus">內建 100 題</span><div class="controls"><button id="loadCsv" class="btn primary">匯入 CSV 更換題庫</button><button id="resetBank" class="btn">恢復內建 100 題</button><button id="sampleCsv" class="btn">下載 CSV 範本</button><input type="file" id="csvFile" accept=".csv,text/csv"></div><small>支援 Anki 格式「正面,背面,標籤」或標準格式「題目,A,B,C,D,答案,解析」。更換題庫後，歷史記錄依題庫分開保存。</small></div><p class="muted">作答後立刻顯示 ✓／✗ 及原始解析。完成後顯示總分、錯題與本次答題紀錄。選項可隨機洗牌，系統會追蹤選項內容而不是位置。</p><label class="radio-row"><input type="radio" name="order" value="original" checked>依照原題號</label><label class="radio-row"><input type="radio" name="order" value="random">隨機排列題目</label><label class="radio-row"><input type="checkbox" id="shuffleChoices" checked>每次測驗隨機排列 A～D 選項（推薦）</label><div class="controls"><button id="start" class="btn primary">開始測驗</button><button id="retry" class="btn">重測最近一次錯題</button><button id="resume" class="btn hidden">繼續上次未完成測驗</button></div><p class="note" style="margin-top:22px">成績保存在<strong>目前瀏覽器的本機儲存空間</strong>，不會上傳。若清除瀏覽器資料、使用無痕模式或換電腦，紀錄可能消失；可定期匯出備份。</p></div><div class="panel"><h2>歷次成績</h2><div id="historyHome"></div><div class="controls"><button id="export" class="btn">匯出成績備份 JSON</button><button id="importBtn" class="btn">還原成績備份</button><input type="file" id="importFile" accept=".json,application/json"><button id="clearHistory" class="btn danger">清除歷次成績</button></div></div></section>
<section id="quiz" class="hidden"><div class="panel"><div class="sub" id="counter"></div><div class="bar"><div id="progressBar"></div></div><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="muted" id="quizMode"></span><span class="muted" id="liveScore"></span></div><div id="questionText"></div><div class="choices" id="choices"></div><div id="feedback" class="hidden"></div><div class="controls"><button class="btn primary hidden" id="next">下一題 →</button><button class="btn" id="backHome">返回首頁（保留進度）</button></div></div></section>
<section id="results" class="hidden"><div class="panel"><h2>測驗成績</h2><p id="resultTitle" class="sub"></p><div class="grid"><div class="metric"><strong class="green" id="correctCount"></strong><small>答對</small></div><div class="metric"><strong class="red" id="wrongCount"></strong><small>答錯</small></div><div class="metric"><strong id="percent"></strong><small>正確率</small></div></div><div class="controls"><button id="wrongRedo" class="btn primary">重測這次錯題</button><button id="resultHome" class="btn">返回首頁</button><button id="exportMistakes" class="btn">下載本次錯題 CSV</button></div><h2 style="margin-top:26px">本次錯題</h2><div id="wrongList"></div></div></section>
</main><script>
 'use strict';
const DEFAULT_BANK=[{"id": 1, "question": "第 1 題｜對於核計勞工所得有無低於基本工資，下列敘述何者有誤？", "options": {"A": "僅計入在正常工時內之報酬", "B": "應計入加班費", "C": "不計入休假日出勤加給之工資", "D": "不計入競賽獎金。"}, "answer": "B", "explanation": "1.勞動基準法第 2 條及第 21 條 加班費不是經常性給與。"}, {"id": 2, "question": "第 2 題｜下列何者之工資日數得列入計算平均工資？", "options": {"A": "請事假期間", "B": "職災醫療期間", "C": "發生計算事由之當日前6個月", "D": "放無薪假期間。"}, "answer": "C", "explanation": "2.勞動基準法第 2 條"}, {"id": 3, "question": "第 3 題｜有關「例假」之敘述，下列何者有誤？", "options": {"A": "每7日應有例假1日", "B": "工資照給", "C": "天災出勤時，工資加倍及補休", "D": "須給假，不必給工資。"}, "answer": "D", "explanation": "3.勞動基準法第 36 條 例假日為有薪假"}, {"id": 4, "question": "第 4 題｜勞動基準法第84條之1規定之工作者，因工作性質特殊，就其工作時間，下列何者正確？", "options": {"A": "完全不受限制", "B": "無例假與休假", "C": "不另給予延時工資", "D": "得由勞雇雙方另行約定。"}, "answer": "D", "explanation": "4.勞動基準法第 84 條之1"}, {"id": 5, "question": "第 5 題｜依勞動基準法規定，雇主應置備勞工工資清冊並應保存幾年？", "options": {"A": "1年", "B": "2年", "C": "5年", "D": "10年。"}, "answer": "C", "explanation": "5.勞動基準法第 23 條"}, {"id": 6, "question": "第 6 題｜事業單位僱用勞工多少人以上者，應依勞動基準法規定訂立工作規則？", "options": {"A": "30人", "B": "50人", "C": "100人", "D": "200人。"}, "answer": "A", "explanation": "6.勞動基準法第 70 條"}, {"id": 7, "question": "第 7 題｜依勞動基準法規定，雇主延長勞工之工作時間連同正常工作時間，每日不得超過多少小時？", "options": {"A": "10小時", "B": "11小時", "C": "12小時", "D": "15小時。"}, "answer": "C", "explanation": "7.勞動基準法第 32 條"}, {"id": 8, "question": "第 8 題｜依勞動基準法規定，下列何者屬不定期契約？", "options": {"A": "臨時性或短期性的工作", "B": "季節性的工作", "C": "特定性的工作", "D": "有繼續性的工作。"}, "answer": "D", "explanation": "8.勞動基準法第 9 條"}, {"id": 9, "question": "第 9 題｜依職業安全衛生法規定，事業單位勞動場所發生死亡職業災害時，雇主應於多少小時內通報勞動檢查機構？", "options": {"A": "8小時", "B": "12小時", "C": "24小時", "D": "48小時。"}, "answer": "A", "explanation": "9.勞動基準法第 37 條"}, {"id": 10, "question": "第 10 題｜有關事業單位之勞資會議主席，下列何者正確？", "options": {"A": "由企業工會推派之", "B": "由產業工會推派之", "C": "由勞資雙方協議推派之", "D": "由勞資雙方輪流擔任之。"}, "answer": "D", "explanation": "10.勞資會議實施辦法第 43 條"}, {"id": 11, "question": "第 11 題｜職業安全衛生法所稱有母性健康危害之虞之工作，不包括下列何種工作型態？", "options": {"A": "長時間站立姿勢作業", "B": "人力提舉、搬運及推拉重物", "C": "輪班及工作負荷", "D": "駕駛運輸車輛。"}, "answer": "D", "explanation": "11.職業安全衛生法施行細則第 39 條"}, {"id": 12, "question": "第 12 題｜依職業安全衛生法施行細則規定，下列何者非屬特別危害健康之作業？", "options": {"A": "噪音作業", "B": "游離輻射作業", "C": "會計作業", "D": "粉塵作業。"}, "answer": "C", "explanation": "12.職業安全衛生法施行細則第 28 條"}, {"id": 13, "question": "第 13 題｜從事於易踏穿材料構築之屋頂修繕作業時，應有何種作業主管在場執行主管業務？", "options": {"A": "施工架組配", "B": "擋土支撐組配", "C": "屋頂", "D": "模板支撐。"}, "answer": "C", "explanation": "13.職業安全衛生法施行細則第 28 條"}, {"id": 14, "question": "第 14 題｜有關「工讀生」之敘述，下列何者正確？", "options": {"A": "工資不得低於基本工資之80％", "B": "屬短期工作者，加班只能補休", "C": "每日正常工作時間得超過8小時", "D": "國定假日出勤，工資加倍發給。"}, "answer": "D", "explanation": "14.勞動基準法第 21, 24, 30, 32, 39 條"}, {"id": 15, "question": "第 15 題｜勞工工作時手部嚴重受傷，住院醫療期間公司應按下列何者給予職業災害補償？", "options": {"A": "前6個月平均工資", "B": "前1年平均工資", "C": "原領工資", "D": "基本工資。"}, "answer": "C", "explanation": "15.勞動基準法第 59 條"}, {"id": 16, "question": "第 16 題｜勞工在何種情況下，雇主得不經預告終止勞動契約？", "options": {"A": "確定被法院判刑6個月以內並諭知緩刑超過1年以上者", "B": "不服指揮對雇主暴力相向者", "C": "經常遲到早退者", "D": "非連續曠工但1個月內累計3日者。"}, "answer": "B", "explanation": "16.勞動基準法第 12 條"}, {"id": 17, "question": "第 17 題｜對於吹哨者保護規定，下列敘述何者有誤？", "options": {"A": "事業單位不得對勞工申訴人終止勞動契約", "B": "勞動檢查機構受理勞工申訴必須保密", "C": "為實施勞動檢查，必要時得告知事業單位有關勞工申訴人身分", "D": "事業單位不得有不利勞工申訴人之處分。"}, "answer": "C", "explanation": "17.公益揭弊者保護法第 15 條"}, {"id": 18, "question": "第 18 題｜職業安全衛生法所稱有母性健康危害之虞之工作，係指對於具生育能力之女性勞工從事工作，可能會導致的一些影響。下列何者除外？", "options": {"A": "胚胎發育", "B": "妊娠期間之母體健康", "C": "哺乳期間之幼兒健康", "D": "經期紊亂。"}, "answer": "D", "explanation": "18.職業安全衛生法第 31 條 <註>懷孕時沒經期紊亂問題。"}, {"id": 19, "question": "第 19 題｜下列何者非屬職業安全衛生法規定之勞工法定義務？", "options": {"A": "定期接受健康檢查", "B": "參加安全衛生教育訓練", "C": "實施自動檢查", "D": "遵守安全衛生工作守則。"}, "answer": "C", "explanation": "19.職業安全衛生法第 20, 32,,34 條"}, {"id": 20, "question": "第 20 題｜下列何者非屬應對在職勞工施行之健康檢查？", "options": {"A": "一般健康檢查", "B": "體格檢查", "C": "特殊健康檢查", "D": "特定對象及特定項目之檢查。"}, "answer": "B", "explanation": "20.職業安全衛生法第 20 條"}, {"id": 21, "question": "第 21 題｜下列何者非為防範有害物食入之方法？", "options": {"A": "有害物與食物隔離", "B": "不在工作場所進食或飲水", "C": "常洗手、漱口", "D": "穿工作服。"}, "answer": "D", "explanation": "21.常識題 病從口入，和穿工作服無關。"}, {"id": 22, "question": "第 22 題｜原事業單位如有違反職業安全衛生法或有關安全衛生規定，致承攬人所僱勞工發生職業災害時，有關承攬管理責任，下列敘述何者正確？", "options": {"A": "原事業單位應與承攬人負連帶賠償責任", "B": "原事業單位不需負連帶補償責任", "C": "承攬廠商應自負職業災害之賠償責任", "D": "勞工投保單位即為職業災害之賠償單位。"}, "answer": "A", "explanation": "22.職業安全衛生法第 25 條"}, {"id": 23, "question": "第 23 題｜依勞動基準法規定，主管機關或檢查機構於接獲勞工申訴事業單位違反本法及其他勞工法令規定後，應為必要之調查，並於幾日內將處理情形，以書面通知勞工？", "options": {"A": "14日", "B": "20日", "C": "30日", "D": "60日。"}, "answer": "D", "explanation": "23.勞動基準法第 74 條"}, {"id": 24, "question": "第 24 題｜我國中央勞動業務主管機關為下列何者？", "options": {"A": "內政部", "B": "勞工保險局", "C": "勞動部", "D": "經濟部。"}, "answer": "C", "explanation": "24.勞動基準法第 4 條"}, {"id": 25, "question": "第 25 題｜對於勞動部公告列入應實施型式驗證之機械、設備或器具，下列何種情形不得免驗證？", "options": {"A": "依其他法律規定實施驗證者", "B": "供國防軍事用途使用者", "C": "輸入僅供科技研發之專用機型", "D": "輸入僅供收藏使用之限量品。"}, "answer": "D", "explanation": "25.職業安全衛生法第 8 條"}, {"id": 26, "question": "第 26 題｜對於墜落危險之預防設施，下列敘述何者較為妥適？", "options": {"A": "在外牆施工架等高處作業應盡量使用繫腰式安全帶", "B": "安全帶應確實配掛在低於足下之堅固點", "C": "高度2m以上之邊緣開口部分處應圍起警示帶", "D": "高度2m以上之開口處應設護欄或安全網。"}, "answer": "D", "explanation": "26.職業安全衛生設施規則第 224 條"}, {"id": 27, "question": "第 27 題｜對於感電電流流過人體可能呈現的症狀，下列敘述何者有誤？", "options": {"A": "痛覺", "B": "強烈痙攣", "C": "血壓降低、呼吸急促、精神亢奮", "D": "造成組織灼傷。"}, "answer": "C", "explanation": "27.常識題 電流不會造成血壓降低、呼吸急促、精神亢奮。"}, {"id": 28, "question": "第 28 題｜下列何者非屬於容易發生墜落災害的作業場所？", "options": {"A": "施工架", "B": "廚房", "C": "屋頂", "D": "梯子、合梯。"}, "answer": "B", "explanation": "28.常識題 廚房為平面，不易發生墜落。"}, {"id": 29, "question": "第 29 題｜下列何者非屬危險物儲存場所應採取之火災爆炸預防措施？", "options": {"A": "使用工業用電風扇", "B": "裝設可燃性氣體偵測裝置", "C": "使用防爆電氣設備", "D": "標示「嚴禁煙火」。"}, "answer": "A", "explanation": "29.常識題 風扇是改善通風，無法預防火災爆炸。"}, {"id": 30, "question": "第 30 題｜雇主於臨時用電設備加裝漏電斷路器，可減少下列何種災害發生？", "options": {"A": "墜落", "B": "物體倒塌、崩塌", "C": "感電", "D": "被撞。"}, "answer": "C", "explanation": "30.常識題 漏電斷路器的作用是發生漏電時會自動斷路，斷路就沒有電流，所以不會感電。"}, {"id": 31, "question": "第 31 題｜雇主要求確實管制人員不得進入吊舉物下方，可避免下列何種災害發生？", "options": {"A": "感電", "B": "墜落", "C": "物體飛落", "D": "缺氧。"}, "answer": "C", "explanation": "31.常識題 吊舉物可能會掉落，在其下方有物體飛落的危險。"}, {"id": 32, "question": "第 32 題｜職業上危害因子所引起的勞工疾病，稱為何種疾病？", "options": {"A": "職業疾病", "B": "法定傳染病", "C": "流行性疾病", "D": "遺傳性疾病。"}, "answer": "A", "explanation": "32.常識題 職業上引起的疾病稱為職業疾病。"}, {"id": 33, "question": "第 33 題｜事業招人承攬時，其承攬人就承攬部分負雇主之責任，原事業單位就職業災害補償部分之責任為何？", "options": {"A": "視職業災害原因判定是否補償", "B": "依工程性質決定責任", "C": "依承攬契約決定責任", "D": "仍應與承攬人負連帶責任。"}, "answer": "D", "explanation": "33.職業安全衛生法第 25 條"}, {"id": 34, "question": "第 34 題｜預防職業病最根本的措施為何？", "options": {"A": "實施特殊健康檢查", "B": "實施作業環境改善", "C": "實施定期健康檢查", "D": "實施僱用前體格檢查。"}, "answer": "B", "explanation": "34.常識題 預防災害的治本方法是做危害源頭管制，所以改善作業環境是第一步。"}, {"id": 35, "question": "第 35 題｜在地下室作業，當通風換氣充分時，則不易發生一氧化碳中毒、缺氧危害或火災爆炸危險。請問「通風換氣充分」係指下列何種描述？", "options": {"A": "風險控制方法", "B": "發生機率", "C": "危害源", "D": "風險。"}, "answer": "A", "explanation": "35.常識題 通風換氣充分可降低風險，所以是風險控制方法。"}, {"id": 36, "question": "第 36 題｜勞工為節省時間，在未斷電情況下清理機臺，易發生危害為何？", "options": {"A": "捲夾感電", "B": "缺氧", "C": "墜落", "D": "崩塌。"}, "answer": "A", "explanation": "36.常識題 未斷電清理機台，首先可能會感電，再者機器行進時，可能發生捲夾。"}, {"id": 37, "question": "第 37 題｜工作場所化學性有害物進入人體最常見路徑為下列何者？", "options": {"A": "口腔", "B": "呼吸道", "C": "皮膚", "D": "眼睛。"}, "answer": "B", "explanation": "37.常識題 病從口入，化學性有害物揮發至空氣中，最常見的是從呼吸道進入人體。"}, {"id": 38, "question": "第 38 題｜活線作業勞工應佩戴何種防護手套？", "options": {"A": "棉紗手套", "B": "耐熱手套", "C": "絕緣手套", "D": "防振手套。"}, "answer": "C", "explanation": "38.常識題 活線作業是指未斷電，所以要戴絕緣手套。"}, {"id": 39, "question": "第 39 題｜下列何者非屬電氣災害類型？", "options": {"A": "電弧灼傷", "B": "電氣火災", "C": "靜電危害", "D": "雷電閃爍。"}, "answer": "D", "explanation": "39.常識題 電氣災害是指電氣引起的災害，例如：電弧灼傷，電氣火災，靜電危害。但雷電閃爍不 是，是電擊才算電氣災害。"}, {"id": 40, "question": "第 40 題｜下列何者非屬於工作場所作業會發生墜落災害的潛在危害因子？", "options": {"A": "開口未設置護欄", "B": "未設置安全之上下設備", "C": "未確實配戴耳罩", "D": "屋頂開口下方未張掛安全網。"}, "answer": "C", "explanation": "40.常識題 墜落災害是指從高處掉落，所以設置護欄、安全網、扶梯皆是防護措施。戴耳罩是防止 噪音災害。"}, {"id": 41, "question": "第 41 題｜在噪音防治之對策中，從下列何者著手最為有效？", "options": {"A": "偵測儀器", "B": "噪音源", "C": "傳播途徑", "D": "個人防護具。"}, "answer": "B", "explanation": "41.常識題 噪音等災害防治，首先是消滅災害源。"}, {"id": 42, "question": "第 42 題｜勞工於室外高氣溫作業環境工作，可能對身體產生之熱危害，下列何者非屬熱危害之症狀？", "options": {"A": "熱衰竭", "B": "中暑", "C": "熱痙攣", "D": "痛風。"}, "answer": "D", "explanation": "42.常識題 痛風是飲食或遺傳造成的，與熱危害無關。"}, {"id": 43, "question": "第 43 題｜下列何者是消除職業病發生率之源頭管理對策？", "options": {"A": "使用個人防護具", "B": "健康檢查", "C": "改善作業環境", "D": "多運動。"}, "answer": "C", "explanation": "43.常識題 改善作業環境屬於災害源頭管制。"}, {"id": 44, "question": "第 44 題｜下列何者非為職業病預防之危害因子？", "options": {"A": "遺傳性疾病", "B": "物理性危害", "C": "人因工程危害", "D": "化學性危害。"}, "answer": "A", "explanation": "44.常識題 遺傳和職業病無關。"}, {"id": 45, "question": "第 45 題｜依職業安全衛生設施規則規定，下列何者非屬使用合梯，應符合之規定？", "options": {"A": "合梯應具有堅固之構造", "B": "合梯材質不得有顯著之損傷、腐蝕等", "C": "梯腳與地面之角度應在80度以上", "D": "有安全之防滑梯面。"}, "answer": "C", "explanation": "45.職業安全衛生設施規則第 230 條"}, {"id": 46, "question": "第 46 題｜下列何者非屬勞工從事電氣工作安全之規定？", "options": {"A": "使其使用電工安全帽", "B": "穿戴絕緣防護具", "C": "停電作業應斷開、檢電、接地及掛牌", "D": "穿戴棉質手套絕緣。"}, "answer": "D", "explanation": "46.職業安全衛生設施規則第 274 條"}, {"id": 47, "question": "第 47 題｜為防止勞工感電，下列何者為非？", "options": {"A": "使用防水插頭", "B": "避免不當延長接線", "C": "設備有金屬外殼保護即可免接地", "D": "電線架高或加以防護。"}, "answer": "C", "explanation": "47.常識題 金屬外殼，例如家中的洗衣機，可能會有靜電，需接地才安全。"}, {"id": 48, "question": "第 48 題｜不當抬舉導致肌肉骨骼傷害或肌肉疲勞之現象，可歸類為下列何者？", "options": {"A": "感電事件", "B": "不當動作", "C": "不安全環境", "D": "被撞事件。"}, "answer": "B", "explanation": "48.常識題 不當抬舉是不當動作。"}, {"id": 49, "question": "第 49 題｜使用鑽孔機時，不應使用下列何護具？", "options": {"A": "耳塞", "B": "防塵口罩", "C": "棉紗手套", "D": "護目鏡。"}, "answer": "C", "explanation": "49.職業安全衛生設施規則第 56 條"}, {"id": 50, "question": "第 50 題｜腕道症候群常發生於下列何種作業？", "options": {"A": "電腦鍵盤作業", "B": "潛水作業", "C": "堆高機作業", "D": "第一種壓力容器作業。"}, "answer": "A", "explanation": "50.常識題 敲鍵盤是用手，使用過度會造成傷害。"}, {"id": 51, "question": "第 51 題｜對於化學燒傷傷患的一般處理原則，下列何者正確？", "options": {"A": "立即用大量清水沖洗", "B": "傷患必須臥下，而且頭、胸部須高於身體其他部位", "C": "於燒傷處塗抹油膏、油脂或發酵粉", "D": "使用酸鹼中和。"}, "answer": "A", "explanation": "51.常識題 化學燒傷，沖脫泡蓋送，所以先用大量清水沖洗。"}, {"id": 52, "question": "第 52 題｜下列何者非屬防止搬運事故之一般原則？", "options": {"A": "以機械代替人力", "B": "以機動車輛搬運", "C": "採取適當之搬運方法", "D": "儘量增加搬運距離。"}, "answer": "D", "explanation": "52.常識題 搬運愈遠，時間愈長，所以風險愈高。"}, {"id": 53, "question": "第 53 題｜對於脊柱或頸部受傷患者，下列何者不是適當的處理原則？", "options": {"A": "不輕易移動傷患", "B": "速請醫師", "C": "如無合用的器材，需2人作徒手搬運", "D": "向急救中心聯絡。"}, "answer": "C", "explanation": "53.常識題 頸部或脊椎有大量神經系統，受傷時，非經醫護人員同意勿移動。"}, {"id": 54, "question": "第 54 題｜於使用道路作業之工作場所，為防止工作人員遭車輛撞擊危害，所採取防護措施，下列何者錯誤？", "options": {"A": "設置警告標示", "B": "置交通引導人員", "C": "管制非工作人員不得進入", "D": "各包商之車輛一律停放於工地現場。"}, "answer": "D", "explanation": "54.依據職業安全衛生設施規則第21-2 條"}, {"id": 55, "question": "第 55 題｜安全帽承受巨大外力衝擊後，雖外觀良好，應採下列何種處理方式？", "options": {"A": "廢棄", "B": "繼續使用", "C": "送修", "D": "油漆保護。"}, "answer": "A", "explanation": "55.常識題 受巨大外力衝擊後的安全帽，內部結構可能有損壞，應立即廢棄。"}, {"id": 56, "question": "第 56 題｜因舉重而扭腰係由於身體動作不自然姿勢，動作之反彈，引起扭筋、扭腰及形成類似狀態造成職業災害，其災害類型為下列何者？", "options": {"A": "不當狀態", "B": "不當動作", "C": "不當方針", "D": "不當設備。"}, "answer": "B", "explanation": "56.常識題 人的不自然姿勢屬不當動作。"}, {"id": 57, "question": "第 57 題｜有關工作場所安全衛生之敘述，下列何者錯誤？", "options": {"A": "對於勞工從事其身體或衣著有被污染之虞之特殊作業時，應備置該勞工洗眼、洗澡、漱口、更衣、洗濯等設備", "B": "事業單位應備置足夠急救藥品及器材", "C": "事業單位應備置足夠的零食自動販賣機", "D": "勞工應定期接受健康檢查。"}, "answer": "C", "explanation": "57.常識題 安全衛生不包括準備零食。"}, {"id": 58, "question": "第 58 題｜在地下室從事油漆粉刷作業，可能呼吸到揮發性有機化合物時，下列措施何者恰當？", "options": {"A": "用手帕遮擋鼻子", "B": "配戴防塵口罩", "C": "配戴濾毒罐面具", "D": "配戴醫用口罩。"}, "answer": "C", "explanation": "58.常識題 揮發性有機化合物，有毒，所以配戴濾毒罐面具。"}, {"id": 59, "question": "第 59 題｜安全門或緊急出口平時應維持何狀態？", "options": {"A": "門可上鎖但不可封死", "B": "保持開門狀態以保持逃生路徑暢通", "C": "門應關上但不可上鎖", "D": "與一般進出門相同，視各樓層規定可開可關。"}, "answer": "C", "explanation": "59.職業安全衛生設施規則第 27 條"}, {"id": 60, "question": "第 60 題｜下列何種防護具較能消減噪音對聽力的危害？", "options": {"A": "棉花球", "B": "耳塞", "C": "耳罩", "D": "碎布球。"}, "answer": "C", "explanation": "60.常識題 耳罩防噪較佳。"}, {"id": 61, "question": "第 61 題｜勞工若面臨長期工作負荷壓力及工作疲勞累積，沒有獲得適當休息及充足睡眠，便可能影響體能及精神狀態，甚而較易促發下列何種疾病？", "options": {"A": "皮膚癌", "B": "腦心血管疾病", "C": "多發性神經病變", "D": "肺水腫。"}, "answer": "B", "explanation": "61.常識題 工作壓力大會引發心血管疾病。"}, {"id": 62, "question": "第 62 題｜「勞工腦心血管疾病發病的風險與年齡、吸菸、總膽固醇數值、家族病史、生活型態、心臟方面疾病」之相關性為何？", "options": {"A": "無", "B": "正", "C": "負", "D": "可正可負。"}, "answer": "B", "explanation": "62.常識題 心血管疾病和年齡相關。"}, {"id": 63, "question": "第 63 題｜下列何者不屬於職場暴力？", "options": {"A": "肢體暴力", "B": "語言暴力", "C": "家庭暴力", "D": "性騷擾。"}, "answer": "C", "explanation": "63.常識題 職場暴力和家庭暴力不同。"}, {"id": 64, "question": "第 64 題｜職場內部常見之身體或精神不法侵害不包含下列何者？", "options": {"A": "脅迫、名譽損毀、侮辱、嚴重辱罵勞工", "B": "強求勞工執行業務上明顯不必要或不可能之工作", "C": "過度介入勞工私人事宜", "D": "使勞工執行與能力、經驗相符的工作。"}, "answer": "D", "explanation": "64.常識題 使勞工執行與能力、經驗相符的工作，是用人唯才，不是侵害。"}, {"id": 65, "question": "第 65 題｜下列何種措施較可避免工作單調重複或負荷過重？", "options": {"A": "連續夜班", "B": "工時過長", "C": "排班保有規律性", "D": "經常性加班。"}, "answer": "C", "explanation": "65.常識題 排班保有規律性，對人的身體而言，當然是較佳的選擇。"}, {"id": 66, "question": "第 66 題｜減輕皮膚燒傷程度之最重要步驟為何？", "options": {"A": "儘速用清水沖洗", "B": "立即刺破水泡", "C": "立即在燒傷處塗抹油脂", "D": "在燒傷處塗抹麵粉。"}, "answer": "A", "explanation": "66.常識題 類同51 題，燒傷，沖脫泡蓋送，所以先用大量清水沖洗。"}, {"id": 67, "question": "第 67 題｜眼內噴入化學物或其他異物，應立即使用下列何者沖洗眼睛？", "options": {"A": "牛奶", "B": "蘇打水", "C": "清水", "D": "稀釋的醋。"}, "answer": "C", "explanation": "67.常識題 異物入眼，先用清水沖洗。"}, {"id": 68, "question": "第 68 題｜石綿最可能引起下列何種疾病？", "options": {"A": "白指症", "B": "心臟病", "C": "間皮細胞瘤", "D": "巴金森氏症。"}, "answer": "C", "explanation": "68.常識題 石綿會沈積在肺部，造成肺癌或間皮瘤(胸腔和腹腔內壁的惡性腫瘤)。"}, {"id": 69, "question": "第 69 題｜作業場所高頻率噪音較易導致下列何種症狀？", "options": {"A": "失眠", "B": "聽力損失", "C": "肺部疾病", "D": "腕道症候群。"}, "answer": "B", "explanation": "69.常識題 噪音造成聽力損失。"}, {"id": 70, "question": "第 70 題｜廚房設置之排油煙機為下列何者？", "options": {"A": "整體換氣裝置", "B": "局部排氣裝置", "C": "吹吸型換氣裝置", "D": "排氣煙囪。"}, "answer": "B", "explanation": "70.常識題 排油煙機是局部排出廢氣的裝置。"}, {"id": 71, "question": "第 71 題｜下列何者為選用防塵口罩時，最不重要之考量因素？", "options": {"A": "捕集效率愈高愈好", "B": "吸氣阻抗愈低愈好", "C": "重量愈輕愈好", "D": "視野愈小愈好。"}, "answer": "D", "explanation": "71.常識題 口罩最重要的是有效果，所以視野較不重要。"}, {"id": 72, "question": "第 72 題｜若勞工工作性質需與陌生人接觸、工作中需處理不可預期的突發事件或工作場所治安狀況較差，較容易遭遇下列何種危害？", "options": {"A": "組織內部不法侵害", "B": "組織外部不法侵害", "C": "多發性神經病變", "D": "潛涵症。"}, "answer": "B", "explanation": "72.常識題 工作性質需接觸組織外部的陌生人，較可能遇到外部不法侵害。"}, {"id": 73, "question": "第 73 題｜下列何者不是發生電氣火災的主要原因？", "options": {"A": "電器接點短路", "B": "電氣火花", "C": "電纜線置於地上", "D": "漏電。"}, "answer": "C", "explanation": "73.常識題"}, {"id": 74, "question": "第 74 題｜依勞工職業災害保險及保護法規定，職業災害保險之保險效力，自何時開始起算，至離職當日停止？", "options": {"A": "通知當日", "B": "到職當日", "C": "雇主訂定當日", "D": "勞雇雙方合意之日。"}, "answer": "B", "explanation": ""}, {"id": 75, "question": "第 75 題｜依勞工職業災害保險及保護法規定，勞工職業災害保險以下列何者為保險人，辦理保險業務？", "options": {"A": "財團法人職業災害預防及重建中心", "B": "勞動部職業安全衛生署", "C": "勞動部勞動基金運用局", "D": "勞動部勞工保險局。"}, "answer": "D", "explanation": ""}, {"id": 76, "question": "第 76 題｜有關「童工」之敘述，下列何者正確？", "options": {"A": "每日工作時間不得超過8小時", "B": "不得於午後8時至翌晨8時之時間內工作", "C": "例假日得在監視下工作", "D": "工資不得低於基本工資之70％。"}, "answer": "A", "explanation": ""}, {"id": 77, "question": "第 77 題｜依勞動檢查法施行細則規定，事業單位如不服勞動檢查結果，可於檢查結果通知書送達之次日起10日內，以書面敘明理由向勞動檢查機構提出？", "options": {"A": "訴願", "B": "陳情", "C": "抗議", "D": "異議。"}, "answer": "D", "explanation": "77.勞動檢查法第 45 條"}, {"id": 78, "question": "第 78 題｜工作者若因雇主違反職業安全衛生法規定而發生職業災害、疑似罹患職業病或身體、精神遭受不法侵害所提起之訴訟，得向勞動部委託之民間團體提出下列何者？", "options": {"A": "災害理賠", "B": "申請扶助", "C": "精神補償", "D": "國家賠償。"}, "answer": "B", "explanation": "78.職業安全衛生施行細則第 52 條"}, {"id": 79, "question": "第 79 題｜計算平日加班費須按平日每小時工資額加給計算，下列敘述何者有誤？", "options": {"A": "前2小時至少加給1/3倍", "B": "超過2小時部分至少加給2/3倍", "C": "經勞資協商同意後，一律加給0.5倍", "D": "未經雇主同意給加班費者，一律補休。"}, "answer": "D", "explanation": "79.勞動基準法第 24 條 <註>未經雇主同意的「自行加班」，原則上勞工不得請求加班費，當然不能申請補休。"}, {"id": 80, "question": "第 80 題｜下列工作場所何者非屬勞動檢查法所定之危險性工作場所？", "options": {"A": "農藥製造", "B": "金屬表面處理", "C": "火藥類製造", "D": "從事石油裂解之石化工業之工作場所。"}, "answer": "B", "explanation": "80.勞動檢查法第 26 條"}, {"id": 81, "question": "第 81 題｜依職業安全衛生設施規則規定，有關電氣安全，下列何者錯誤？", "options": {"A": "110伏特之電壓不致造成人員死亡", "B": "電氣室應禁止非工作人員進入", "C": "不可以濕手操作電氣開關，且切斷開關應迅速", "D": "220伏特為低壓電。"}, "answer": "A", "explanation": "81.常識題 電氣安全方面，會造成人員死亡的是原因電流太大而不是電壓。"}, {"id": 82, "question": "第 82 題｜依職業安全衛生設施規則規定，下列何者非屬於車輛系營建機械？", "options": {"A": "平土機", "B": "堆高機", "C": "推土機", "D": "鏟土機。"}, "answer": "B", "explanation": "82.職業安全衛生設施規則第 6 條"}, {"id": 83, "question": "第 83 題｜下列何者非為事業單位勞動場所發生職業災害者，雇主應於8小時內通報勞動檢查機構？", "options": {"A": "發生死亡災害", "B": "勞工受傷無須住院治療", "C": "發生災害之罹災人數在3人以上", "D": "發生災害之罹災人數在1人以上，且需住院治療。"}, "answer": "B", "explanation": "83.職業安全衛法第 37 條"}, {"id": 84, "question": "第 84 題｜依職業安全衛生管理辦法規定，下列何者非屬「自動檢查」之內容？", "options": {"A": "機械之定期檢查", "B": "機械、設備之重點檢查", "C": "機械、設備之作業檢點", "D": "勞工健康檢查。"}, "answer": "D", "explanation": "84.職業安全衛管理辦法第 13, 17, 45, 64 條"}, {"id": 85, "question": "第 85 題｜下列何者係針對於機械操作點的捲夾危害特性可以採用之防護裝置？", "options": {"A": "設置護圍、護罩", "B": "穿戴棉紗手套", "C": "穿戴防護衣", "D": "強化教育訓練。"}, "answer": "A", "explanation": "85.常識題 捲夾危害，設置護圍使人無法靠近。"}, {"id": 86, "question": "第 86 題｜下列何者非屬從事起重吊掛作業導致物體飛落災害之可能原因？", "options": {"A": "吊鉤未設防滑舌片致吊掛鋼索鬆脫", "B": "鋼索斷裂", "C": "超過額定荷重作業", "D": "過捲揚警報裝置過度靈敏。"}, "answer": "D", "explanation": "86.常識題 警報靈敏不會有物體飛落。"}, {"id": 87, "question": "第 87 題｜勞工不遵守安全衛生工作守則規定，屬於下列何者？", "options": {"A": "不安全設備", "B": "不安全行為", "C": "不安全環境", "D": "管理缺陷。"}, "answer": "B", "explanation": "87.常識題 人(勞工)是不安全行為的執行者。"}, {"id": 88, "question": "第 88 題｜下列何者不屬於局限空間內作業場所應採取之缺氧、中毒等危害預防措施？", "options": {"A": "實施通風換氣", "B": "進入作業許可程序", "C": "使用柴油內燃機發電提供照明", "D": "測定氧氣、危險物、有害物濃度。"}, "answer": "C", "explanation": "88.職業安全衛生設施規則第 29-1 條"}, {"id": 89, "question": "第 89 題｜下列何者非通風換氣之目的？", "options": {"A": "防止游離輻射", "B": "防止火災爆炸", "C": "稀釋空氣中有害物", "D": "補充新鮮空氣。"}, "answer": "A", "explanation": "89.常識題 警報靈敏不會有物體飛落。"}, {"id": 90, "question": "第 90 題｜已在職之勞工，首次從事特別危害健康作業，應實施下列何種檢查？", "options": {"A": "一般體格檢查", "B": "特殊體格檢查", "C": "一般體格檢查及特殊健康檢查", "D": "特殊健康檢查。"}, "answer": "D", const ABCD=['A','B','C','D'];const $=x=>document.getElementById(x);

const shuffled=arr=>{let a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const decode=s=>String(s||'').replace(/<br\s*\/?\s*>/gi,'\n').replace(/<[^>]*>/g,'').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'").trim();

const key=x=>'osh_exam_v3_'+x+'_'+bankId;

function show(page){for(const x of ['home','quiz','results'])$(x).classList.toggle('hidden',x!==page);window.scrollTo(0,0)}

function signature(qs){let h=2166136261;const raw=JSON.stringify(qs);for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+'_'+qs.length}
function selectBank(bank,persist){if(!Array.isArray(bank)||!bank.length||bank.length>5000)throw Error('題庫題數應介於 1～5000 題');let normalized=bank.map((q,i)=>({id:i+1,question:q.question,options:q.options,answer:q.answer,explanation:q.explanation||''}));for(const q of normalized){if(!q.question||!ABCD.every(x=>typeof q.options?.[x]==='string'&&q.options[x].trim())||!ABCD.includes(q.answer))throw Error('題庫資料有不完整的選項或答案')}BANK=normalized;bankId=normalized===DEFAULT_BANK?'builtin100':signature(normalized);if(persist)put('osh_exam_custom_bank_v3',normalized);$('bankStatus').textContent=`${BANK.length} 題（${persist?'自訂 CSV': '內建題庫'}）`;session=null;latestResult=null;renderHome()}
function parseCSV(src){src=src.replace(/^\uFEFF/,'');const sample=src.split(/\r?\n/).slice(0,2).join('\n');const delim=[',',';','\t'].sort((a,b)=>sample.split(b).length-sample.split(a).length)[0];let out=[],row=[],cell='',quoted=false;for(let i=0;i<src.length;i++){let ch=src[i];if(quoted){if(ch==='"'&&src[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===delim){row.push(cell);cell=''}else if(ch==='\r'||ch==='\n'){if(ch==='\r'&&src[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))out.push(row);row=[];cell=''}else cell+=ch}if(quoted)throw Error('CSV 引號沒有正確結束');row.push(cell);if(row.some(v=>v.trim()))out.push(row);return out}
function importQuestions(text){const rows=parseCSV(text);if(rows.length<2)throw Error('CSV 沒有有效題目');const hdr=rows[0].map(x=>x.trim().replace(/^\uFEFF/,''));const find=(names)=>hdr.findIndex(s=>names.includes(s));const fi=find(['正面','Front']),bi=find(['背面','Back']),qi=find(['題目','問題','question']),ai=find(['答案','正確答案','answer']),exi=find(['解析','說明','explanation']);let qs=[];
for(let rowIndex=1;rowIndex<rows.length;rowIndex++){const r=rows[rowIndex];if(!r.some(x=>x.trim()))continue;let question,options,answer,explanation='';if(fi>=0&&bi>=0){const front=decode(r[fi]),back=decode(r[bi]);let parts=front.split(/(?:^|\n)\s*([ABCD])\s*[.．、：:]\s*/);if(parts.length!==9)throw Error(`CSV 第 ${rowIndex+1} 列：無法辨識四個選項`);question=parts[0].replace(/^第\s*\d+\s*題\s*[｜|:]\s*/,'').trim();options={A:parts[2].trim(),B:parts[4].trim(),C:parts[6].trim(),D:parts[8].trim()};answer=back.match(/正確答案\s*[：:]\s*([ABCD])/i)?.[1]?.toUpperCase();explanation=back.split(/原檔解析／法規提示\s*[：:]/)[1]?.trim()||'';}else if(qi>=0&&ai>=0&&ABCD.every(x=>find([x])>=0)){question=decode(r[qi]);options=Object.fromEntries(ABCD.map(x=>[x,decode(r[find([x])])]));answer=decode(r[ai]).toUpperCase().match(/^[ABCD]/)?.[0];explanation=exi>=0?decode(r[exi]):''}else throw Error('欄位格式不支援。請使用 Anki「正面,背面,標籤」或「題目,A,B,C,D,答案,解析」');if(!question||!answer||!ABCD.every(x=>options[x]))throw Error(`CSV 第 ${rowIndex+1} 列：題目、選項或答案缺漏`);qs.push({id:qs.length+1,question,options,answer,explanation})}if(!qs.length)throw Error('沒有可匯入的題目');return qs}
function newSession(ids,mode){if(!ids.length){alert('沒有可重測的錯題');return}if(get(key('session'),null)&&!confirm('目前有未完成測驗，確定以新測驗取代？'))return;const shuffle=$('shuffleChoices').checked;session={ids,mode,at:new Date().toISOString(),index:0,answers:{},perms:Object.fromEntries(ids.map(id=>[id,shuffle?shuffled(ABCD):[...ABCD]])),bankId};saveSession();renderQuiz()}
function startFull(){let ids=BANK.map(q=>q.id);if(document.querySelector('input[name="order"]:checked').value==='random')ids=shuffled(ids);newSession(ids,'完整測驗')}
function isCorrect(r,id){return r.answers[id]===BANK[id-1]?.answer}
function startMistakes(r){if(!r){alert('還沒有已完成的測驗');return}newSession(r.ids.filter(id=>!isCorrect(r,id)),'錯題重測')}
function renderQuiz(){if(!session)return renderHome();show('quiz');let id=session.ids[session.index],q=BANK[id-1],answer=session.answers[id],perm=session.perms[id];if(!q||!perm)return alert('測驗資料不完整，請重新開始');$('counter').textContent=`第 ${session.index+1}／${session.ids.length} 題 · 原題號 ${id}`;$('quizMode').textContent=session.mode;$('questionText').textContent=q.question;$('progressBar').style.width=((session.index+(answer?1:0))/session.ids.length*100)+'%';let reviewed=Object.keys(session.answers);$('liveScore').textContent=`已作答 ${reviewed.length} 題 · 正確 ${reviewed.filter(i=>isCorrect(session,+i)).length} 題`;let list=$('choices');list.innerHTML='';perm.forEach((sourceLetter,idx)=>{let letter=ABCD[idx],btn=document.createElement('button');btn.className='choice'+(answer&&sourceLetter===q.answer?' correct':'')+(answer===sourceLetter&&answer!==q.answer?' wrong':'')+(answer===sourceLetter?' selected':'');btn.disabled=!!answer;btn.innerHTML=`<span class="letter">${letter}</span><span>${esc(q.options[sourceLetter])}</span>`;btn.onclick=()=>record(sourceLetter);list.append(btn)});let rightLetter=ABCD[perm.indexOf(q.answer)];$('feedback').className=answer?'feedback'+(answer===q.answer?'':' bad'):'hidden';$('feedback').innerHTML=answer?`<strong>${answer===q.answer?'✓ 答對':'✗ 答錯'} · 正確答案 ${rightLetter}</strong><div>${esc(q.options[q.answer])}</div>${q.explanation?`<div class="muted" style="margin-top:9px">原檔解析／法規提示：${esc(q.explanation)}</div>`:''}`:'';$('next').classList.toggle('hidden',!answer);$('next').textContent=session.index===session.ids.length-1?'完成測驗，查看成績 →':'下一題 →'}
function record(sourceLetter){const id=session.ids[session.index];if(session.answers[id])return;session.answers[id]=sourceLetter;saveSession();renderQuiz()}
function next(){if(!session?.answers[session.ids[session.index]])return;if(session.index+1===session.ids.length)return finish();session.index++;saveSession();renderQuiz()}
function finish(){let n=session.ids.length,correct=session.ids.filter(id=>isCorrect(session,id)).length;latestResult={id:Date.now(),date:new Date().toISOString(),mode:session.mode,ids:[...session.ids],answers:{...session.answers},perms:session.perms,correct,total:n,bankId};const h=history();h.unshift(latestResult);put(key('history'),h);localStorage.removeItem(key('session'));session=null;renderResult(latestResult)}
function displayAnswer(r,id,origLetter){let perm=r.perms?.[id]||ABCD;let disp=ABCD[perm.indexOf(origLetter)]||origLetter;return `${disp}. ${BANK[id-1].options[origLetter]}`}
function renderResult(r){latestResult=r;show('results');$('resultTitle').textContent=`${new Date(r.date).toLocaleString('zh-TW')} · ${r.mode} · 共 ${r.total} 題`;$('correctCount').textContent=r.correct;$('wrongCount').textContent=r.total-r.correct;$('percent').textContent=(100*r.correct/r.total).toFixed(1)+'%';let wrong=r.ids.filter(id=>!isCorrect(r,id));$('wrongRedo').disabled=!wrong.length;$('wrongList').innerHTML=wrong.length?wrong.map(id=>{let q=BANK[id-1];return `<div class="answer-item"><span class="tag">第 ${id} 題</span><div style="margin-top:6px">${esc(q.question)}</div><div class="red">你的答案：${esc(displayAnswer(r,id,r.answers[id]))}</div><div class="green">正確答案：${esc(displayAnswer(r,id,q.answer))}</div><div class="muted">${esc(q.explanation)}</div></div>`}).join(''):'<p class="green">全部答對！</p>'}
function renderHome(){show('home');$('bankStatus').textContent=`${BANK.length} 題（${bankId==='builtin100'?'內建題庫':'CSV 自訂題庫'}）`;$('start').textContent=`開始 ${BANK.length} 題測驗`;let h=history();$('retry').disabled=!h.length||h[0].correct===h[0].total;$('resume').classList.toggle('hidden',!get(key('session'),null));$('historyHome').innerHTML=h.length?`<div style="overflow-x:auto"><table class="history"><thead><tr><th>日期</th><th>類型</th><th>成績</th><th>錯題</th><th>查看</th></tr></thead><tbody>${h.map((r,i)=>`<tr><td>${esc(new Date(r.date).toLocaleString('zh-TW'))}</td><td>${esc(r.mode)}</td><td>${r.correct}/${r.total}</td><td>${r.total-r.correct}</td><td><button class="btn" data-view="${i}">查看</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">尚無已完成的測驗成績。</p>';$('historyHome').querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>renderResult(h[+el.dataset.view]))}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportWrong(){if(!latestResult)return;let r=latestResult,wrong=r.ids.filter(id=>!isCorrect(r,id));const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';let lines=[['題號','題目','你的答案','正確答案','解析'],...wrong.map(id=>[id,BANK[id-1].question,displayAnswer(r,id,r.answers[id]),displayAnswer(r,id,BANK[id-1].answer),BANK[id-1].explanation])];download('錯題_'+new Date().toISOString().slice(0,10)+'.csv','﻿'+lines.map(row=>row.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function validateBackup(h){return Array.isArray(h)&&h.length<=10000&&h.every(r=>r&&Array.isArray(r.ids)&&r.ids.every(id=>Number.isInteger(id)&&id>=1&&id<=BANK.length)&&r.answers&&typeof r.answers==='object'&&r.total===r.ids.length&&Number.isInteger(r.correct)&&r.correct>=0&&r.correct<=r.total&&typeof r.date==='string')}
$('start').onclick=startFull;$('retry').onclick=()=>startMistakes(history()[0]);$('next').onclick=next;$('backHome').onclick=renderHome;$('resultHome').onclick=renderHome;$('wrongRedo').onclick=()=>startMistakes(latestResult);$('exportMistakes').onclick=exportWrong;
$('resume').onclick=()=>{session=get(key('session'),null);if(!session?.ids||!session?.perms)return renderHome();renderQuiz()};
$('loadCsv').onclick=()=>$('csvFile').click();$('csvFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{const bank=importQuestions(await file.text());if(!confirm(`讀取成功：${bank.length} 題。確定更換目前題庫？（舊題庫歷次成績仍會依題庫分開保存）`))return;selectBank(bank,true)}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};
$('resetBank').onclick=()=>{if(!confirm('切換回內建 100 題？'))return;localStorage.removeItem('osh_exam_custom_bank_v3');BANK=DEFAULT_BANK;bankId='builtin100';session=null;latestResult=null;renderHome()};
$('sampleCsv').onclick=()=>download('模擬考_CSV範本.csv','\ufeff題目,A,B,C,D,答案,解析\r\n"工作場所應提供何種措施？","安全設備","忽略風險","免除教育","取消防護","A","示意題，僅供格式參考"','text/csv;charset=utf-8');
$('export').onclick=()=>download('測驗成績備份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'osh-exam-v3',bankId,bank:BANK,history:history()},null,2),'application/json');
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.app!=='osh-exam-v3'||obj.bankId!==bankId||!validateBackup(obj.history))throw Error('備份格式錯誤或題庫版本不一致');if(!confirm('合併這份題庫的歷次成績？'))return;const ids=new Set(),merged=[...history(),...obj.history].filter(r=>{let k=r.id+'|'+r.date;if(ids.has(k))return false;ids.add(k);return true}).sort((a,b)=>new Date(b.date)-new Date(a.date));put(key('history'),merged);renderHome();alert('還原完成')}catch(err){alert(err.message)}finally{e.target.value=''}};
$('clearHistory').onclick=()=>{if(confirm('確定清除目前題庫的歷次成績？建議先匯出備份。')){localStorage.removeItem(key('history'));renderHome()}};
const saved=get('osh_exam_custom_bank_v3',null);if(Array.isArray(saved)&&saved.length){try{selectBank(saved,false)}catch{BANK=DEFAULT_BANK;bankId='builtin100';renderHome()}}else renderHome();
</script></body></html>
